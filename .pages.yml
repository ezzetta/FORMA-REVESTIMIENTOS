media:
  input: assets/products
  output: /assets/products
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif, svg]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Crear {name}"
      update: "Actualizar {name}"
      delete: "Eliminar {name}"

content:
  - name: products
    label: Productos
    type: collection
    path: content/products
    format: json
    filename: "{id}.json"
    operations:
      delete: false
      rename: false
    view:
      primary: name
      fields: [name, published, category, stock_status, featured]
      sort: sort_order
    fields:
      - name: id
        label: Identificador
        type: string
        required: true
        description: "Código único en minúsculas y con guiones. No cambiar en un producto existente."
      - name: name
        label: Nombre
        type: string
        required: true
      - name: published
        label: Mostrar producto
        type: boolean
      - name: featured
        label: Destacado
        type: boolean
      - name: sort_order
        label: Orden
        type: number
        options: { min: 0 }
      - name: category
        label: Categoría
        type: select
        options:
          values: [Accesorios, Alfombras, Cielorrasos, Complementos, Jardines verticales, Paneles WPC, Papeles autoadhesivos, Pisos, Placas decorativas, Placas símil piedra, Rollos gran formato, Vinilos]
      - name: uses
        label: Uso
        type: select
        options:
          multiple: true
          values:
            - { name: interior, label: Interior }
            - { name: exterior, label: Exterior }
      - name: spaces
        label: Ambientes
        type: select
        options:
          multiple: true
          values:
            - { name: living, label: Living y dormitorio }
            - { name: cocina, label: Cocina y comedor }
            - { name: baño, label: Baño }
            - { name: exterior, label: Exterior }
            - { name: fachada, label: Fachada }
            - { name: local, label: Locales y oficinas }
      - name: meta
        label: Formato resumido
        type: string
      - name: description
        label: Descripción
        type: text
      - name: pricing
        label: Precio, descuento y rendimiento
        type: object
        fields:
          - name: show_price
            label: Mostrar precio en la web
            type: boolean
            default: true
          - name: amount
            label: Precio de venta en pesos (por unidad de venta)
            type: number
            description: "Importe sin descuento, sin símbolo $. Si vendés por caja, cargar el precio de la caja. Vacío conserva el texto de precio anterior."
            options: { min: 0 }
          - name: unit
            label: Unidad de venta
            type: select
            default: unidad
            options:
              values: [unidad, placa, caja, rollo, pack, cartucho, m², metro lineal]
          - name: coverage_m2
            label: Rendimiento en m² de esa unidad de venta
            type: number
            description: "Ejemplo: caja que cubre 2,2 m² → 2.2. Se calcula precio final ÷ rendimiento. Dejar vacío si no aplica. Si vendés por m² se usa 1 automáticamente."
            options: { min: 0.0001 }
          - name: discount_percent
            label: Descuento (%)
            type: number
            default: 0
            description: "Solo se aplica si activás Oferta. El precio final y el precio por m² se calculan automáticamente al publicar."
            options: { min: 0, max: 100 }
      - name: price
        label: Texto de precio cuando no hay importe numérico
        type: string
        description: "Por ejemplo, Consultar precio. El importe numérico tiene prioridad."
      - name: stock_status
        label: Disponibilidad
        type: select
        options:
          values: [Consultar, Disponible, A pedido, Sin stock]
      - name: stock_quantity
        label: Cantidad disponible
        type: number
        options: { min: 0 }
      - name: offer
        label: Oferta
        type: object
        fields:
          - { name: enabled, label: Activar oferta, type: boolean }
          - { name: label, label: Texto de oferta, type: string }
      - name: gallery
        label: Galería
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{kind}: {alt}"
        fields:
          - { name: src, label: Imagen, type: image, required: true }
          - { name: alt, label: Descripción de imagen, type: string }
          - name: kind
            label: Tipo
            type: select
            options:
              values: [Ambientación, Producto real, Presentación, Instalación, Información técnica, Detalle de trama, Detalle constructivo, Presentacion ambientada, Pendiente]
      - name: specs_list
        label: Especificaciones
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {value}"
        fields:
          - { name: label, label: Dato, type: string }
          - { name: value, label: Valor, type: string }
      - name: variants
        label: Colores y variantes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - { name: id, label: Identificador relacionado, type: string }
          - { name: label, label: Nombre visible, type: string }
          - { name: color, label: Color, type: string }
          - { name: swatch, label: Muestra de color hexadecimal, type: string }
          - { name: image, label: Imagen, type: image }

actions:
  - name: deploy-site
    label: Publicar cambios
    workflow: deploy-pages.yml
    ref: current
