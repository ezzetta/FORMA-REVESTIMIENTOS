media:
  input: assets/products
  output: /assets/products
  rename: safe
  extensions: [jpg, jpeg, png, webp]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Crear {name}"
      update: "Actualizar {name}"
      delete: "Eliminar {name}"

content:
  - name: products
    label: Productos
    type: collection
    path: content/products
    format: json
    filename: "{id}.json"
    operations:
      delete: false
      rename: false
    view:
      primary: name
      fields: [name, supplier, brand, category, published]
      sort: sort_order
    fields:
      - name: id
        label: Identificador
        type: string
        required: true
        description: "Código único en minúsculas y con guiones. No cambiar en un producto existente."
      - name: name
        label: Nombre
        type: string
        required: true
      - name: published
        label: Mostrar producto (requiere 3 fotos)
        type: boolean
        default: false
        description: "La publicación exige 3 fotos distintas válidas. Revisá el Control del catálogo para ver los pendientes."
      - name: featured
        label: Destacado
        type: boolean
      - name: sort_order
        label: Orden
        type: number
        options: { min: 0 }
      - name: category
        label: Categoría
        type: select
        options:
          values: [Muros y paredes, Pisos, Cielorrasos, Vidrios, Terminaciones y accesorios]
      - name: uses
        label: Uso
        type: select
        options:
          multiple: true
          values:
            - { name: interior, label: Interior }
            - { name: exterior, label: Exterior }
      - name: adhesive_system
        label: Sistema de colocación
        type: select
        description: "Dejar vacío para clasificar según el nombre y tipo de producto."
        options:
          values: [Automático, Autoadhesivo, Otro sistema]
      - name: product_type
        label: Tipo de material
        type: string
        description: "Ejemplos: Panel WPC, Piso SPC, Placa autoadhesiva, Perfil de terminación. No repetir la aplicación."
      - name: finish
        label: Aspecto / acabado
        type: select
        description: "Agrupa productos de distintos formatos. Dejar vacío para clasificación automática."
        options:
          values: [Mármoles, Maderas, Vidrios, Piedras, Cementos, Otros acabados]
      - name: supplier
        label: Proveedor (gestión interna)
        type: select
        options:
          values: [DIFAN, Vita Deko, FORMA, Por confirmar]
      - name: brand
        label: Marca del producto
        type: string
        description: "Marca que ve el cliente. Mantener una denominación uniforme: DIFAN DECO o Vita Deko, según corresponda."
      - name: supplier_sku
        label: Código del proveedor
        type: string
      - name: source_url
        label: Ficha de origen del proveedor
        type: string
      - name: source_checked_at
        label: Última revisión de la fuente
        type: string
        readonly: true
      - name: supplier_availability
        label: Disponibilidad verificada del proveedor
        type: select
        description: "Stock del proveedor, distinto del stock propio. Para DIFAN solo se publican fichas confirmadas En stock."
        options:
          values:
            - { name: in_stock, label: En stock en proveedor }
            - { name: out_of_stock, label: Sin stock en proveedor }
            - { name: unverified, label: Pendiente de verificar }
      - name: editor_notes
        label: Pendientes de la ficha
        type: text
      - name: installation
        label: Instalación y preparación
        type: text
      - name: care
        label: Cuidado y mantenimiento
        type: text
      - name: technical_notes
        label: Aclaraciones técnicas
        type: text
      - name: technical_documents
        label: Documentación técnica
        type: object
        list: true
        fields:
          - { name: label, label: Nombre, type: string }
          - { name: url, label: Enlace HTTPS, type: string }
      - name: options
        label: Colores dentro de la misma publicación (perfiles y zócalos)
        type: object
        list: true
        fields:
          - { name: label, label: Color o terminación, type: string }
          - { name: sku, label: Código del proveedor, type: string }
          - { name: supplier_url, label: Ficha de origen, type: string }
      - name: meta
        label: Formato resumido
        type: string
      - name: description
        label: Descripción
        type: text
      - name: pricing
        label: Precio, descuento y rendimiento
        type: object
        fields:
          - name: show_price
            label: Mostrar precio en la web
            type: boolean
            default: false
          - name: amount
            label: Precio de venta en pesos (por unidad de venta)
            type: number
            description: "Importe sin descuento, sin símbolo $. Si vendés por caja, cargar el precio de la caja. Vacío conserva el texto de precio anterior."
            options: { min: 0 }
          - name: unit
            label: Unidad de venta
            type: select
            default: unidad
            options:
              values: [unidad, placa, caja, rollo, pack, cartucho, m², metro lineal]
          - name: coverage_m2
            label: Rendimiento en m² de esa unidad de venta
            type: number
            description: "Ejemplo: caja que cubre 2,2 m² → 2.2. Se calcula precio final ÷ rendimiento. Dejar vacío si no aplica. Si vendés por m² se usa 1 automáticamente."
            options: { min: 0.0001 }
          - name: discount_percent
            label: Descuento (%)
            type: number
            default: 0
            description: "Solo se aplica si activás Oferta. El precio final y el precio por m² se calculan automáticamente al publicar."
            options: { min: 0, max: 100 }
      - name: price
        label: Texto de precio cuando no hay importe numérico
        type: string
        description: "Por ejemplo, Consultar precio. El importe numérico tiene prioridad."
      - name: stock_status
        label: Disponibilidad
        type: select
        options:
          values: [Consultar, Disponible, A pedido, Sin stock]
      - name: stock_quantity
        label: Cantidad disponible
        type: number
        options: { min: 0 }
      - name: offer
        label: Oferta
        type: object
        fields:
          - { name: enabled, label: Activar oferta, type: boolean }
          - { name: label, label: Texto de oferta, type: string }
      - name: gallery
        label: Galería de fotos
        type: object
        description: "Mínimo 3 fotos distintas del producto. Recomendado cuadrado 1600×1600 px, JPG o WebP, hasta 2 MB por imagen (máximo admitido 10 MB). Las fichas técnicas y referencias de otros colores no cuentan como fotos."
        list:
          collapsible:
            collapsed: true
            summary: "{kind}: {alt}"
        fields:
          - { name: src, label: Imagen, type: image, required: true }
          - { name: alt, label: Descripción de imagen, type: string }
          - { name: counts_as_photo, label: Cuenta como foto propia del producto, type: boolean, default: true }
          - name: association
            label: Correspondencia de la imagen
            type: select
            default: exact
            options:
              values:
                - { name: exact, label: Producto y diseño exactos }
                - { name: family_shared, label: Referencia de familia (no cuenta) }
                - { name: technical, label: Ficha técnica (no cuenta) }
          - name: kind
            label: Tipo
            type: select
            options:
              values: [Producto real, Foto del proveedor, Ambientación, Ambientación del proveedor, Detalle de producto, Detalle ilustrativo, Detalle de trama, Detalle constructivo, Presentación, Instalación, Información técnica, Detalle de familia, Detalle de familia (varios colores), Comparativa de colores o formatos, Producto, Presentacion ambientada, Producto colocado, Vista similar (complementaria), Pendiente]
      - name: specs_list
        label: Especificaciones
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {value}"
        fields:
          - { name: label, label: Dato, type: string }
          - { name: value, label: Valor, type: string }
      - name: variants
        label: Colores y variantes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - { name: id, label: Identificador relacionado, type: string }
          - { name: label, label: Nombre visible, type: string }
          - { name: color, label: Color, type: string }
          - { name: swatch, label: Muestra de color hexadecimal, type: string }
          - { name: image, label: Imagen, type: image }

actions:
  - name: deploy-site
    label: Publicar cambios
    workflow: deploy-pages.yml
    ref: current
